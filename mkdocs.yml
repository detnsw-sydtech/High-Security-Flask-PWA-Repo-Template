site_name: Sydney Technical High School [High-Security Flask PWA Template]
site_description: Sydney Technical High School — Architecture & Engineering Documentation
site_author: Sydney Technical High School

theme:
  name: material
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.code.highlight
    - content.code.fences
    - content.code.mermaid
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    primary: blue grey
    accent: indigo
  logo: https://avatars.githubusercontent.com/u/250778024?s=200&v=4
  favicon: https://avatars.githubusercontent.com/u/250778024?s=200&v=4

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - tables

  # Syntax highlighting (Pygments)
  - codehilite:
      guess_lang: false
      linenums: false

  # Table of contents
  - toc:
      permalink: true

  # Advanced fenced code blocks
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details

extra_css:
  - _static/theme.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sydneytechnicalhighschool

plugins:
  - search
  - mermaid2
  - autorefs

nav:
  - Home: index.md

  - Architecture:
      - App Factory: architecture/app-factory-overview.md
      - Database Model: architecture/database-model-overview.md
      - Blueprints: architecture/blueprints-overview.md
      - Security: architecture/security-overview.md
      - Search System: architecture/search-system-overview.md
      - Relationships Overview: architecture/relational-relationships-overview.md
      - ERD Diagram: architecture/relational-erd.md
      - How to Read ERDs: architecture/how-to-read-mermaid-erds.md
      - ERD vs Models: architecture/erd-vs-models-side-by-side.md
      - ERD Exercise: architecture/erd-drawing-exercise.md

  - Maintenance:
      - Codespace Terminal: maintenance/codespace-terminal.md

  - Student Guide:
      - Documentation Style Guide: student/style-guide.md
      - Coding Standards: student/coding-standards.md
