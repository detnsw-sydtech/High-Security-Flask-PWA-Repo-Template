site_name: High-Security Flask PWA Template
site_description: Sydney Technical High School — Architecture & Engineering Documentation
site_author: Sydney Technical High School

theme:
  name: material
  palette:
    primary: blue grey
    accent: indigo
  logo: https://avatars.githubusercontent.com/u/250778024?s=200&v=4
  favicon: https://avatars.githubusercontent.com/u/250778024?s=200&v=4

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.snippets

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sydneytechnicalhighschool

nav:
  - Home: index.md
  - Architecture:
      - App Factory: docs/architecture/app-factory-overview.md
      - Database Model: docs/architecture/database-model-overview.md
      - Blueprints: docs/architecture/blueprints-overview.md
      - Security: docs/architecture/security-overview.md
      - Search System: docs/architecture/search-system-overview.md
      - Relationships Overview: docs/architecture/relational-relationships-overview.md
      - ERD Diagram: docs/architecture/relational-erd.md
      - How to Read ERDs: docs/architecture/how-to-read-mermaid-erds.md
      - ERD vs Models: docs/architecture/erd-vs-models-side-by-side.md
      - ERD Exercise: docs/architecture/erd-drawing-exercise.md
