<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Library Catalogue</title>

    <!-- Simple, clean styling -->
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 2rem;
            background: #f7f7f7;
            color: #222;
        }

        h1 {
            margin-bottom: 1rem;
        }

        .search-container {
            margin-bottom: 1.5rem;
        }

        .search-container input {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .item-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
        }

        .item-card {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .item-card h3 {
            margin-top: 0;
            margin-bottom: 0.5rem;
        }

        .pagination {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .pagination button {
            padding: 0.5rem 1rem;
            border: none;
            background: #005bbb;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        .pagination button:hover {
            background: #004999;
        }
    </style>
</head>

<body>

<h1>Online Library Catalogue</h1>

<div class="search-container">
    <input
        type="text"
        name="q"
        placeholder="Search books, authors, categories..."
        hx-get="/catalogue"
        hx-target="#catalogue-results"
        hx-trigger="keyup changed delay:300ms"
        hx-include="[name='q']"
    >
</div>

<!-- Dynamic catalogue container -->
<div id="catalogue-results"
     hx-get="/catalogue"
     hx-trigger="load"
     hx-target="#catalogue-results"
     hx-swap="innerHTML">
</div>

<!-- HTMX -->
<script src="https://unpkg.com/htmx.org@1.9.10"></script>

</body>
</html>
