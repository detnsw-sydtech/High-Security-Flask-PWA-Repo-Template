{% extends "base.html" %}

{% block title %}Home — Online Library Catalogue{% endblock %}

{% block breadcrumbs %}
    Home
{% endblock %}

{% block content %}

<h1>Online Library Catalogue</h1>

<p>Welcome! Use the search bar or browse the full catalogue.</p>

<a href="/catalogue/full"
   style="display:inline-block;margin-bottom:1rem;padding:0.5rem 1rem;background:#005bbb;color:white;border-radius:6px;text-decoration:none;">
    Browse Full Catalogue
</a>

<div id="catalogue-results"
     hx-get="/catalogue"
     hx-trigger="load"
     hx-target="#catalogue-results"
     hx-swap="innerHTML">
</div>

{% endblock %}
