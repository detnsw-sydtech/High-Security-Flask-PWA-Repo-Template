<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>You Are Offline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      color: #003366;
      text-align: center;
    }
    .box {
      max-width: 400px;
      margin: auto;
      padding: 2rem;
      border: 2px solid #003366;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Offline Mode</h1>
    <p>Your device is not connected to the internet.</p>
    <p>The app will reconnect automatically when your connection returns.</p>
  </div>
</body>
</html>
