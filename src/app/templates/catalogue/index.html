{% extends "base.html" %}

{% block title %}Catalogue — Online Library Catalogue{% endblock %}

{% block breadcrumbs %}
    <a href="/">Home</a> › Catalogue
{% endblock %}

{% block content %}

<h1>Full Catalogue</h1>

<a href="/"
   style="display:inline-block;margin-bottom:1rem;padding:0.5rem 1rem;background:#444;color:white;border-radius:6px;text-decoration:none;">
    Back to Home
</a>

<div class="filters">

    <input
        type="text"
        name="q"
        placeholder="Search title, description, identifier..."
        hx-get="/catalogue"
        hx-target="#catalogue-results"
        hx-trigger="keyup changed delay:300ms"
        hx-include=".filters"
    >

    <select name="category"
            hx-get="/catalogue"
            hx-target="#catalogue-results"
            hx-trigger="change"
            hx-include=".filters">
        <option value="">All Categories</option>
        {% for c in categories %}
            <option value="{{ c.name }}">{{ c.name }}</option>
        {% endfor %}
    </select>

    <select name="creator"
            hx-get="/catalogue"
            hx-target="#catalogue-results"
            hx-trigger="change"
            hx-include=".filters">
        <option value="">All Creators</option>
        {% for cr in creators %}
            <option value="{{ cr.name }}">{{ cr.name }}</option>
        {% endfor %}
    </select>

    <select name="type"
            hx-get="/catalogue"
            hx-target="#catalogue-results"
            hx-trigger="change"
            hx-include=".filters">
        <option value="">All Types</option>
        {% for t in item_types %}
            <option value="{{ t.name }}">{{ t.name }}</option>
        {% endfor %}
    </select>

    <select name="sort"
            hx-get="/catalogue"
            hx-target="#catalogue-results"
            hx-trigger="change"
            hx-include=".filters">
        <option value="created_at">Newest</option>
        <option value="title">Title</option>
        <option value="year">Year</option>
    </select>

    <select name="direction"
            hx-get="/catalogue"
            hx-target="#catalogue-results"
            hx-trigger="change"
            hx-include=".filters">
        <option value="desc">Descending</option>
        <option value="asc">Ascending</option>
    </select>

</div>

<div id="catalogue-results"
     hx-get="/catalogue"
     hx-trigger="load"
     hx-target="#catalogue-results"
     hx-swap="innerHTML">
</div>

{% endblock %}
