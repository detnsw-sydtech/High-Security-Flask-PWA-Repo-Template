<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Online Library Catalogue{% endblock %}</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 2rem;
            background: #f7f7f7;
            color: #222;
        }

        nav {
            margin-bottom: 1.5rem;
        }

        nav a {
            margin-right: 1rem;
            text-decoration: none;
            color: #005bbb;
            font-weight: 600;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .breadcrumbs {
            font-size: 0.9rem;
            margin-bottom: 1rem;
            color: #555;
        }

        .breadcrumbs a {
            color: #005bbb;
            text-decoration: none;
        }

        .breadcrumbs a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 3rem;
            padding-top: 1rem;
            border-top: 1px solid #ccc;
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>

<body>

<nav class="nav"> 
    <a href="{{ url_for('main.index') }}">Home</a> 
    <a href="{{ url_for('catalogue.catalogue_full') }}">Catalogue</a>
    <a href="{{ url_for('catalogue.catalogue_debug') }}">Debug JSON</a> 
</nav>


<div class="breadcrumbs">
    {% block breadcrumbs %}{% endblock %}
</div>

{% block content %}{% endblock %}

<footer>
    STHS Online Library Catalogue — Flask PWA Reference Architecture
</footer>

<!-- Secure SRI-enabled HTMX import -->
<script 
    src="https://unpkg.com/htmx.org@1.9.10"
    integrity="sha384-3Z1JYbWtaXDpUe1koRaSPo6e7iT730cdpShUMHbOWcZH/5LiCFYI8aAkaI0s5mom"
    crossorigin="anonymous">
</script>

</body>
</html>
