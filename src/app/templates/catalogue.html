<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catalogue – Online Library Catalogue</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 2rem;
            background: #f7f7f7;
            color: #222;
        }

        nav {
            margin-bottom: 2rem;
        }

        nav a {
            margin-right: 1rem;
            text-decoration: none;
            color: #005bbb;
            font-weight: 600;
        }

        nav a:hover {
            text-decoration: underline;
        }

        h1 {
            margin-bottom: 1rem;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .filters input,
        .filters select {
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
        }

        .item-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
        }

        .item-card {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .item-card h3 {
            margin-top: 0;
            margin-bottom: 0.5rem;
        }

        .pagination {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .pagination button {
            padding: 0.5rem 1rem;
            border: none;
            background: #005bbb;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        .pagination button:hover {
            background: #004999;
        }
    </style>
</head>

<body>

<nav>
    <a href="/">Home</a>
    <a href="/catalogue/full">Catalogue</a>
</nav>

<h1>Full Catalogue</h1>

<!-- FILTER BAR -->
<div class="filters">

    <!-- Search -->
    <input
        type="text"
        name="q"
        placeholder="Search title, description, identifier..."
        hx-get="/catalogue"
        hx-target="#catalogue-results"
        hx-trigger="keyup changed delay:300ms"
        hx-include=".filters"
    >

    <!-- Category filter -->
    <select
        name="category"
        hx-get="/catalogue"
        hx-target="#catalogue-results"
        hx-trigger="change"
        hx-include=".filters"
    >
        <option value="">All Categories</option>
        {% for c in categories %}
            <option value="{{ c.name }}">{{ c.name }}</option>
        {% endfor %}
    </select>

    <!-- Creator filter -->
    <select
        name="creator"
        hx-get="/catalogue"
        hx-target="#catalogue-results"
        hx-trigger="change"
        hx-include=".filters"
    >
        <option value="">All Creators</option>
        {% for cr in creators %}
            <option value="{{ cr.name }}">{{ cr.name }}</option>
        {% endfor %}
    </select>

    <!-- Item Type filter -->
    <select
        name="type"
        hx-get="/catalogue"
        hx-target="#catalogue-results"
        hx-trigger="change"
        hx-include=".filters"
    >
        <option value="">All Types</option>
        {% for t in item_types %}
            <option value="{{ t.name }}">{{ t.name }}</option>
        {% endfor %}
    </select>

    <!-- Sorting -->
    <select
        name="sort"
        hx-get="/catalogue"
        hx-target="#catalogue-results"
        hx-trigger="change"
        hx-include=".filters"
    >
        <option value="created_at">Newest</option>
        <option value="title">Title</option>
        <option value="year">Year</option>
    </select>

    <select
        name="direction"
        hx-get="/catalogue"
        hx-target="#catalogue-results"
        hx-trigger="change"
        hx-include=".filters"
    >
        <option value="desc">Descending</option>
        <option value="asc">Ascending</option>
    </select>

</div>

<!-- Dynamic catalogue container -->
<div id="catalogue-results"
     hx-get="/catalogue"
     hx-trigger="load"
     hx-target="#catalogue-results"
     hx-swap="innerHTML">
</div>

<script src="https://unpkg.com/htmx.org@1.9.10"></script>

</body>
</html>
