[project]
name = "high-security-flask-pwa-template"
version = "0.1.0"
description = "High-security Flask PWA template with modern front-end tooling for SE12"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
packages = ["src"]

# ------------------------------------------------------------
# Runtime dependencies
# ------------------------------------------------------------
dependencies = [
  # --- Flask core ---
  "flask==3.0.2",                 # Flask framework
  "jinja2>=3.1.4",                # Template rendering engine
  "werkzeug>=3.0.3",              # WSGI utilities and HTTP handling
  "itsdangerous==2.2.0",          # Secure signing utilities
  "click==8.1.7",                 # CLI command framework

  # --- Security ---
  "flask-talisman==1.1.0",        # CSP, HSTS, secure headers
  "flask-limiter==3.5.0",         # Rate limiting middleware
  "bcrypt==4.1.2",                # Password hashing
  "python-dotenv==1.0.1",         # Environment variable loading

  # --- Database / ORM ---
  "sqlalchemy>=2.0",              # Core ORM and query engine
  "flask-sqlalchemy>=3.0",        # Flask integration for SQLAlchemy
  "alembic>=1.13",                # Database migrations
  "flask-migrate>=4.1",           # Database migrations

  # --- PWA essentials ---
  "flask-compress==1.14",         # Gzip/Brotli compression
  "flask-caching==2.1.0",         # Caching backend for performance
  "flask-htmx==0.4.0",            # HTMX integration for partial updates

  # --- Front-end enhancement ---
  "markupsafe==2.1.5",            # Safe HTML escaping for templates

  # --- Data generation ---
  "faker>=25.0",                  # Generate synthetic catalogue data

  # --- Date handling ---
  "python-dateutil>=2.9",         # Robust date parsing and manipulation

  # --- Validation ---
  "email-validator>=2.1",         # Validate member email addresses

  # --- Forms (optional but recommended) ---
  "wtforms>=3.1",                 # Form handling and validation
  "flask-wtf>=1.2",               # CSRF-protected Flask forms

  # --- Slug generation (optional) ---
  "python-slugify>=8.0",          # Generate clean slugs for URLs
]

# ------------------------------------------------------------
# Optional dependency groups (uv-compatible)
# ------------------------------------------------------------
[dependency-groups]
dev = [
  "pytest",                       # Test runner
  "pytest-cov",                   # Coverage reporting
  "ruff",                         # Linting and formatting
  "mypy",                         # Static type checking
  "bandit",                       # Security linting
  "semgrep",                      # Pattern-based static analysis
  "pip-audit",                    # Dependency vulnerability scanning
]

# ------------------------------------------------------------
# uv configuration
# ------------------------------------------------------------
[tool.uv]
# Dev dependencies now live under [dependency-groups]
# Install them with:
#   uv sync --group dev

# ------------------------------------------------------------
# Ruff configuration
# ------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ------------------------------------------------------------
# Mypy configuration
# ------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
strict = true

# ------------------------------------------------------------
# Pytest configuration
# ------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "--disable-warnings --maxfail=1"
testpaths = ["tests"]

# ------------------------------------------------------------
# Bandit configuration
# ------------------------------------------------------------
[tool.bandit]
skips = ["B101"]  # allow assert in tests

# ------------------------------------------------------------
# Semgrep configuration
# ------------------------------------------------------------
[tool.semgrep]
config = ["p/ci"]
