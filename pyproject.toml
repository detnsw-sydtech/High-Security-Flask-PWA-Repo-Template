[project]
name = "high-security-flask-pwa-template"
version = "0.1.0"
description = "High-security Flask PWA template with modern front-end tooling for SE12"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
packages = ["src"]

# ------------------------------------------------------------
# Runtime dependencies
# ------------------------------------------------------------
dependencies = [
  # --- Flask core ---
  "flask==3.1.3",
  "jinja2>=3.1.4",
  "werkzeug>=3.0.3",
  "itsdangerous==2.2.0",
  "click==8.1.7",

  # --- MkDocs + plugins (runtime, required for CI builds) ---
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-material-extensions>=1.3",
  "mkdocs-mermaid2-plugin>=1.1",
  "mkdocs-autorefs>=1.0",

  # --- Security ---
  "flask-talisman==1.1.0",
  "flask-limiter==3.5.0",
  "bcrypt==4.1.2",
  "python-dotenv==1.0.1",

  # --- Protobuf (patched version) ---
  "protobuf>=6.33.5",

  # --- Database / ORM ---
  "sqlalchemy>=2.0",
  "flask-sqlalchemy>=3.0",
  "alembic>=1.13",
  "flask-migrate>=4.1",

  # --- PWA essentials ---
  "flask-compress==1.14",
  "flask-caching==2.1.0",
  "flask-htmx==0.4.0",

  # --- Front-end enhancement ---
  "markupsafe==2.1.5",

  # --- Data generation ---
  "faker>=25.0",

  # --- Date handling ---
  "python-dateutil>=2.9",

  # --- Validation ---
  "email-validator>=2.1",

  # --- Forms ---
  "wtforms>=3.1",
  "flask-wtf>=1.2",

  # --- Slug generation ---
  "python-slugify>=8.0",
]

# ------------------------------------------------------------
# Optional dependency groups (uv-compatible)
# ------------------------------------------------------------
[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "bandit",
  "semgrep",
  "pip-audit",
]

# ------------------------------------------------------------
# uv configuration
# ------------------------------------------------------------
[tool.uv]
# Dev dependencies now live under [dependency-groups]
# Install them with:
#   uv sync --group dev

# ------------------------------------------------------------
# Ruff configuration
# ------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "A", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ------------------------------------------------------------
# Mypy configuration
# ------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
strict = true

# ------------------------------------------------------------
# Pytest configuration
# ------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "--disable-warnings --maxfail=1"
testpaths = ["tests"]

# ------------------------------------------------------------
# Bandit configuration
# ------------------------------------------------------------
[tool.bandit]
skips = ["B101"]

# ------------------------------------------------------------
# Semgrep configuration
# ------------------------------------------------------------
[tool.semgrep]
config = ["p/ci"]
