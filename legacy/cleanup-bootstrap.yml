name: Cleanup Bootstrap Workflow

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove bootstrap workflow and placeholders
        run: |
          # Remove the bootstrap workflow
          rm -f .github/workflows/bootstrap.yml

          # Optional: remove placeholder files
          rm -f .devcontainer/placeholder.txt
          rm -f src/app/auth/placeholder.txt
          rm -f src/app/db/placeholder.txt
          rm -f src/app/main/placeholder.txt
          rm -f src/app/pwa/placeholder.txt
          rm -f src/app/security/placeholder.txt
          rm -f src/app/static/placeholder.txt
          rm -f src/app/templates/placeholder.txt
          rm -f tests/placeholder.txt

          # Remove this cleanup workflow after it runs
          rm -f .github/workflows/cleanup-bootstrap.yml

      - name: Commit cleanup changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Cleanup bootstrap workflow and placeholders"
          commit_user_name: "github-actions"
          commit_user_email: "github-actions@github.com"
