name: 00 Print Repository Tree

on:
  workflow_dispatch:

jobs:
  print-tree:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tree
        run: sudo apt-get update && sudo apt-get install -y tree

      - name: Generate repository trees
        run: |
          # Whole repo tree
          tree -a -p -h -I '.git|.github|.venv' -L 10 > repo-tree.txt
          cp repo-tree.txt repo-tree.md

          # src tree
          if [ -d "src" ]; then
            tree -a -p -h src > src-tree.md
          fi

          # tests tree
          if [ -d "tests" ]; then
            tree -a -p -h tests > tests-tree.md
          fi

          # static tree
          if [ -d "static" ]; then
            tree -a -p -h static > static-tree.md
          fi

      - name: Upload tree artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repository-trees
          path: |
            repo-tree.txt
            repo-tree.md
            src-tree.md
            tests-tree.md
            static-tree.md
