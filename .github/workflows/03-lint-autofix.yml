name: 03 Ruff Autofix (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: .

jobs:
  ruff-autofix:
    name: Run Ruff autofix and commit changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.20"

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies (app + dev)
        run: uv sync --frozen --directory .venv

      - name: Run Ruff autofix
        run: .venv/bin/ruff check . --fix

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply Ruff autofixes"
          git push
