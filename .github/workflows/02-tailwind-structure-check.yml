name: 02 Tailwind Structure Check
permissions:
  contents: read

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  tailwind-structure:
    name: Validate Tailwind Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Tailwind config exists
        run: |
          if [ ! -f "tailwind.config.js" ]; then
            echo "ERROR: tailwind.config.js missing"
            exit 1
          fi

      - name: Verify Tailwind input folder exists
        run: |
          if [ ! -d "src/app/static/src" ]; then
            echo "ERROR: Tailwind input folder missing: src/app/static/src"
            exit 1
          fi

      - name: Verify Tailwind input.css exists
        run: |
          if [ ! -f "src/app/static/src/input.css" ]; then
            echo "ERROR: Tailwind input.css missing: src/app/static/src/input.css"
            exit 1
          fi

      - name: Verify Tailwind output folder exists
        run: |
          if [ ! -d "src/app/static/css" ]; then
            echo "ERROR: Tailwind css folder missing: src/app/static/css"
            exit 1
          fi

      - name: Verify Tailwind output tailwind.css exists
        run: |
          if [ ! -f "src/app/static/css/tailwind.css" ]; then
            echo "ERROR: Tailwind output tailwind.css missing: src/app/static/css/tailwind.css"
            echo "Run the staff-only workflow 50 Build Tailwind CSS to generate it."
            exit 1
          fi

      - name: Tailwind structure check passed
        run: echo "✔ Tailwind structure is valid."
