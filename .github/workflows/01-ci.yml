name: 01 CI - Tests and Security

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:

  # ---------------------------------------------------------
  # 1. Tailwind folder structure check
  # ---------------------------------------------------------
  check-tailwind-folders:
    name: Check Tailwind folder structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Tailwind folder exists
        run: |
          if [ ! -d "src/app/static/css" ]; then
            echo "ERROR: Tailwind css folder missing: src/app/static/css"
            exit 1
          fi

          if [ ! -f "src/app/static/src/input.css" ]; then
            echo "ERROR: Tailwind input.css missing at src/app/static/src/input.css"
            exit 1
          fi

          echo "Tailwind folder structure OK"


  # ---------------------------------------------------------
  # 2. Quality Gate (Ruff + pytest + mypy)
  # ---------------------------------------------------------
  quality:
    name: Quality (Ruff + pytest + mypy)
    runs-on: ubuntu-latest
    needs: check-tailwind-folders

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.20"

      - name: Install Python 3.13 via uv
        run: uv python install 3.13

      - name: Cache uv package store
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies (app + dev)
        run: uv sync --frozen --directory .venv

      # -----------------------------
      # Ruff autofix + commit
      # -----------------------------
      - name: Ruff autofix
        run: uv run ruff check . --fix

      - name: Commit Ruff fixes
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply Ruff autofix" || echo "No changes to commit"

      - name: Ruff (lint + style)
        run: uv run ruff check .

      # -----------------------------
      # Mypy (static typing)
      # -----------------------------
      - name: Mypy (static typing)
        run: uv run mypy --config-file mypy.ini src

      # -----------------------------
      # Pytest
      # -----------------------------
      - name: Pytest (unit tests)
        run: uv run pytest -q


  # ---------------------------------------------------------
  # 3. SAST (Bandit + Semgrep)
  # ---------------------------------------------------------
  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.20"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Cache uv package store
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Create virtual environment
        run: uv venv

      - name: Install dev dependencies
        run: uv sync --frozen --directory .venv

      - name: Bandit (Python SAST)
        run: uv run bandit -r src -ll -c bandit.yaml

      - name: Semgrep (security rules)
        uses: returntocorp/semgrep-action@v1
        with:
          config: r/python.security.audit


  # ---------------------------------------------------------
  # 4. Dependency Vulnerabilities + SBOM
  # ---------------------------------------------------------
  dependencies:
    name: Dependency Vulnerabilities + SBOM (pip-audit)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.20"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Cache uv package store
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --frozen --directory .venv

      - name: pip-audit (Python dependency vulnerabilities)
        run: uv run pip-audit

      - name: Generate SBOM (CycloneDX JSON)
        run: uv run pip-audit --format cyclonedx-json --output sbom-python.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-python
          path: sbom-python.json


  # ---------------------------------------------------------
  # 5. Secret Scanning (Gitleaks)
  # ---------------------------------------------------------
  secrets:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}


  # ---------------------------------------------------------
  # 6. OSV Scanning
  # ---------------------------------------------------------
  osv:
    name: OSV Scanning (whole repo)
    runs-on: ubuntu-latest
    needs: [quality, dependencies]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OSV scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
            -o osv-scanner
          chmod +x osv-scanner

      - name: Run OSV scanner
        run: |
          ./osv-scanner \
            --lockfile=uv.lock \
            --config=./osv-scanner.toml


  # ---------------------------------------------------------
  # 7. DAST Scanning
  # ---------------------------------------------------------
  dast:
    name: DAST OWASP Baseline Scan
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.20"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --frozen --directory .venv

      - name: Start Flask app
        run: |
          uv run flask run --host=0.0.0.0 --port=5000 &
          sleep 5

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: "http://localhost:5000"
