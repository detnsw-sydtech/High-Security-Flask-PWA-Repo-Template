name: 01 CI - Tests and Security

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:

  # ---------------------------------------------------------
  # 1. Tailwind folder structure check
  # ---------------------------------------------------------
  check-tailwind-folders:
    name: Check Tailwind folder structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Tailwind folder exists
        run: |
          if [ ! -d "src/app/static/css" ]; then
            echo "ERROR: Tailwind css folder missing: src/app/static/css"
            exit 1
          fi

          if [ ! -f "src/app/static/src/input.css" ]; then
            echo "ERROR: Tailwind input.css missing at src/app/static/src/input.css"
            exit 1
          fi

          echo "Tailwind folder structure OK"


  # ---------------------------------------------------------
  # 2. Quality Gate (Ruff + pytest + mypy)
  # ---------------------------------------------------------
  quality:
    name: Quality (Ruff + pytest + mypy)
    runs-on: ubuntu-latest
    needs: check-tailwind-folders

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.20"

      - name: Install Python 3.12 via uv
        run: uv python install 3.12 && uv python pin 3.12

      - name: Cache uv package store
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies (app + dev)
        run: uv sync --frozen

      - name: Reset caches (GitHub-side canonical state)
        run: bash scripts/reset_caches.sh

      - name: Ruff autofix
        run: uv run ruff check . --fix

      - name: Commit Ruff fixes
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply Ruff autofix" || echo "No changes to commit"

      - name: Ruff (lint + style)
        run: uv run ruff check .

      - name: Mypy (static typing)
        run: uv run mypy --config-file mypy.ini src

      - name: Pytest (unit tests)
        run: uv run pytest -q


  # ---------------------------------------------------------
  # 3. SAST (Bandit + Semgrep)
  # ---------------------------------------------------------
  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.20"

      - name: Install Python 3.12
        run: uv python install 3.12 && uv python pin 3.12

      - name: Cache uv package store
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Create virtual environment
        run: uv venv

      - name: Install dev dependencies
        run: uv sync --frozen

      - name: Bandit (Python SAST)
        run: uv run bandit -r src -ll -c bandit.yaml

      - name: Semgrep (security rules)
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto


  # ---------------------------------------------------------
  # 4. Dependency Vulnerabilities + SBOM
  # ---------------------------------------------------------
  dependencies:
    name: Dependency Vulnerabilities + SBOM (pip-audit)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.20"

      - name: Install Python 3.12
        run: uv python install 3.12 && uv python pin 3.12

      - name: Cache uv package store
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Create virtual environment
        run: uv venv

      - name: Install dev dependencies
        run: uv sync --frozen

      - name: pip-audit (vulnerability scan)
        run: uv run pip-audit --strict --desc --format markdown --output pip-audit-report.md

      - name: Upload SBOM + audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.md
