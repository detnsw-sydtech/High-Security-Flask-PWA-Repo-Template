name: 54 Maintainer Dependency Update (Staff Only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-deps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.20"

      - name: Upgrade dependencies and regenerate lockfile
        run: uv lock --upgrade

      - name: Commit updated lockfile
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Upgrade dependencies and regenerate uv.lock"
          commit_user_name: "github-actions"
          commit_user_email: "github-actions@github.com"
