name: 56 Recreate Canonical Template (Dangerous)

on:
  workflow_dispatch:

jobs:
  recreate-canonical:
    name: Rebuild Canonical Flask PWA Template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove all files except .git and .github
        run: |
          shopt -s extglob
          for entry in * .[^.]*; do
            if [[ "$entry" == ".git" || "$entry" == ".github" ]]; then
              continue
            fi
            rm -rf "$entry"
          done

      - name: Ensure .github/workflows is preserved
        run: |
          mkdir -p .github/workflows

      - name: Recreate directory structure
        run: |
          mkdir -p src/app/templates
          mkdir -p src/app/static/css
          mkdir -p src/app/static/src
          mkdir -p src/app/static/js
          mkdir -p src/app/static/icons
          mkdir -p src/app/tests

      # -----------------------------
      # Flask Core Files
      # -----------------------------

      - name: Create __init__.py
        run: |
          cat << 'EOF' > src/app/__init__.py
from flask import Flask
from .routes import bp as routes_bp

def create_app():
    app = Flask(__name__)
    app.register_blueprint(routes_bp)
    return app
EOF

      - name: Create routes.py
        run: |
          cat << 'EOF' > src/app/routes.py
from flask import Blueprint, render_template

bp = Blueprint("routes", __name__)

@bp.route("/")
def index():
    return render_template("index.html")

@bp.route("/offline")
def offline():
    return render_template("offline.html")
EOF

      - name: Create security.py
        run: |
          cat << 'EOF' > src/app/security.py
"""
Security utilities for the High-Security Flask PWA Template.
"""
EOF

      - name: Create pwa.py
        run: |
          cat << 'EOF' > src/app/pwa.py
"""
PWA helpers for the High-Security Flask PWA Template.
"""
EOF

      # -----------------------------
      # Templates
      # -----------------------------

      - name: Create base.html
        run: |
          cat << 'EOF' > src/app/templates/base.html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flask PWA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
</head>
<body class="bg-gray-100 text-gray-900">
    {% block content %}{% endblock %}
</body>
</html>
EOF

      - name: Create index.html
        run: |
          cat << 'EOF' > src/app/templates/index.html
{% extends "base.html" %}
{% block content %}
<h1 class="text-3xl font-bold">Flask PWA Template</h1>
<p class="mt-4">This is the canonical high-security Flask PWA template.</p>
{% endblock %}
EOF

      - name: Create offline.html
        run: |
          cat << 'EOF' > src/app/templates/offline.html
{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-semibold">You are offline.</h1>
<p class="mt-2">Some features may be unavailable until connection is restored.</p>
{% endblock %}
EOF

      # -----------------------------
      # Tests
      # -----------------------------

      - name: Create test_routes.py
        run: |
          cat << 'EOF' > src/app/tests/test_routes.py
def test_index_route(client):
    response = client.get("/")
    assert response.status_code == 200
EOF

      - name: Create test_security.py
        run: |
          cat << 'EOF' > src/app/tests/test_security.py
def test_security_module_imports():
    import app.security
EOF

      # -----------------------------
      # PWA Static Files
      # -----------------------------

      - name: Create service-worker.js
        run: |
          cat << 'EOF' > src/app/static/js/service-worker.js
self.addEventListener("install", (event) => {
  event.waitUntil(self.skipWaiting());
});

self.addEventListener("activate", (event) => {
  event.waitUntil(self.clients.claim());
});

self.addEventListener("fetch", (event) => {
  // Placeholder for caching strategies
});
EOF

      - name: Create pwa.js
        run: |
          cat << 'EOF' > src/app/static/js/pwa.js
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/static/js/service-worker.js");
  });
}
EOF

      - name: Create manifest.json
        run: |
          cat << 'EOF' > src/app/static/manifest.json
{
  "name": "High Security Flask PWA",
  "short_name": "FlaskPWA",
  "start_url": "/",
  "display": "standalone",
  "background_color": "#ffffff",
  "theme_color": "#2563eb",
  "icons": []
}
EOF

      # -----------------------------
      # Tailwind Files
      # -----------------------------

      - name: Create Tailwind input.css
        run: |
          cat << 'EOF' > src/app/static/src/input.css
@tailwind base;
@tailwind components;
@tailwind utilities;
EOF

      - name: Create placeholder tailwind.css
        run: |
          cat << 'EOF' > src/app/static/css/tailwind.css
/* Tailwind CSS is generated by workflow 50 Build Tailwind CSS (Staff Only). */
EOF

      # -----------------------------
      # Project Root Files
      # -----------------------------

      - name: Create README.md
        run: |
          cat << 'EOF' > README.md
# High-Security Flask PWA Template

This repository contains the canonical high-security Flask PWA template.
EOF

      - name: Create LICENSE
        run: |
          cat << 'EOF' > LICENSE
MIT License
EOF

      - name: Create .gitignore
        run: |
          cat << 'EOF' > .gitignore
__pycache__/
*.pyc
node_modules/
EOF

      - name: Create pyproject.toml
        run: |
          cat << 'EOF' > pyproject.toml
[project]
name = "high-security-flask-pwa"
version = "0.1.0"
EOF

      - name: Create package.json
        run: |
          cat << 'EOF' > package.json
{
  "name": "high-security-flask-pwa-frontend",
  "version": "0.1.0",
  "private": true,
  "scripts": {
    "dev": "tailwindcss -i ./src/app/static/src/input.css -o ./src/app/static/css/tailwind.css --watch",
    "build": "tailwindcss -i ./src/app/static/src/input.css -o ./src/app/static/css/tailwind.css --minify"
  }
}
EOF

      - name: Create tailwind.config.js
        run: |
          cat << 'EOF' > tailwind.config.js
module.exports = {
  content: ["./src/app/templates/**/*.html"],
  theme: { extend: {} },
  plugins: []
};
EOF

      - name: Final confirmation
        run: echo "Canonical template successfully recreated."
