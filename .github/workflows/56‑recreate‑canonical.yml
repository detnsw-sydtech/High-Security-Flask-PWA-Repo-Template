name: 56 Recreate Canonical Template (Dangerous) 13012026

on:
  workflow_dispatch:

jobs:
  recreate-canonical:
    name: Rebuild Canonical Flask PWA Template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove all files except .git and .github/workflows
        run: |
          shopt -s extglob
          rm -rf !( .git | .github )
          rm -rf .github/!(workflows)
          rm -rf .github/workflows/!(**)

      - name: Recreate directory structure
        run: |
          mkdir -p src/app/templates
          mkdir -p src/app/static/css
          mkdir -p src/app/static/src
          mkdir -p src/app/static/js
          mkdir -p src/app/static/icons
          mkdir -p src/app/tests

      - name: Create Flask app files
        run: |
          cat > src/app/__init__.py << 'EOF'
from flask import Flask
from .routes import bp as routes_bp

def create_app():
    app = Flask(__name__)
    app.register_blueprint(routes_bp)
    return app
EOF

          cat > src/app/routes.py << 'EOF'
from flask import Blueprint, render_template

bp = Blueprint("routes", __name__)

@bp.route("/")
def index():
    return render_template("index.html")

@bp.route("/offline")
def offline():
    return render_template("offline.html")
EOF

          cat > src/app/security.py << 'EOF'
# Security utilities for the High-Security Flask PWA Template
EOF

          cat > src/app/pwa.py << 'EOF'
# PWA helpers (service worker registration, manifest loading)
EOF

          cat > src/app/tests/test_routes.py << 'EOF'
def test_index_route(client):
    response = client.get("/")
    assert response.status_code == 200
EOF

          cat > src/app/tests/test_security.py << 'EOF'
def test_security_module_imports():
    import app.security
EOF

          cat > src/app/templates/base.html << 'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flask PWA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
</head>
<body class="bg-gray-100 text-gray-900">
    {% block content %}{% endblock %}
</body>
</html>
EOF

          cat > src/app/templates/index.html << 'EOF'
{% extends "base.html" %}
{% block content %}
<h1 class="text-3xl font-bold">Flask PWA Template</h1>
{% endblock %}
EOF

          cat > src/app/templates/offline.html << 'EOF'
{% extends "base.html" %}
{% block content %}
<h1 class="text-xl">You are offline.</h1>
{% endblock %}
EOF

      - name: Create PWA static files
        run: |
          cat > src/app/static/js/service-worker.js << 'EOF'
// Basic offline service worker
self.addEventListener("install", () => self.skipWaiting());
self.addEventListener("activate", () => clients.claim());
EOF

          cat > src/app/static/js/pwa.js << 'EOF'
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/js/service-worker.js");
}
EOF

          cat > src/app/static/manifest.json << 'EOF'
{
  "name": "High Security Flask PWA",
  "short_name": "FlaskPWA",
  "start_url": "/",
  "display": "standalone",
  "background_color": "#ffffff",
  "theme_color": "#2563eb"
}
EOF

      - name: Create Tailwind input file
        run: |
          cat > src/app/static/src/input.css << 'EOF'
@tailwind base;
@tailwind components;
@tailwind utilities;
EOF

      - name: Create placeholder Tailwind output file
        run: |
          echo "/* Tailwind CSS will be generated by workflow 50-build-tailwind */" > src/app/static/css/tailwind.css

      - name: Create project root files
        run: |
          cat > README.md << 'EOF'
# High-Security Flask PWA Template
Canonical rebuild generated by workflow 56-recreate-canonical.yml.
EOF

          cat > LICENSE << 'EOF'
MIT License
EOF

          cat > .gitignore << 'EOF'
__pycache__/
*.pyc
node_modules/
EOF

          cat > pyproject.toml << 'EOF'
[project]
name = "high-security-flask-pwa"
version = "0.1.0"
EOF

          cat > package.json << 'EOF'
{
  "name": "high-security-flask-pwa-frontend",
  "version": "0.1.0",
  "scripts": {
    "dev": "tailwindcss -i ./src/app/static/src/input.css -o ./src/app/static/css/tailwind.css --watch",
    "build": "tailwindcss -i ./src/app/static/src/input.css -o ./src/app/static/css/tailwind.css --minify"
  }
}
EOF

          cat > tailwind.config.js << 'EOF'
module.exports = {
  content: ["./src/app/templates/**/*.html"],
  theme: { extend: {} },
  plugins: []
}
EOF

      - name: Final confirmation
        run: echo "Canonical template successfully recreated."
