name: 56 Recreate Canonical Template (Dangerous)

on:
  workflow_dispatch:

jobs:
  recreate-canonical:
    name: Rebuild Canonical Flask PWA Template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove all files except .git and .github
        shell: bash
        run: |
          shopt import -q extglob || true
          shopt -s extglob
          for entry in * .[^.]*; do
            if [[ "$entry" == ".git" || "$entry" == ".github" ]]; then
              continue
            fi
            rm -rf "$entry"
          done

      - name: Ensure .github/workflows is preserved
        shell: bash
        run: |
          mkdir -p .github/workflows

      - name: Recreate directory structure
        shell: bash
        run: |
          mkdir -p src/app/templates
          mkdir -p src/app/static/css
          mkdir -p src/app/static/src
          mkdir -p src/app/static/js
          mkdir -p src/app/static/icons
          mkdir -p src/app/tests

      - name: Create Flask core files
        shell: bash
        run: |
          cat << 'EOF' > src/app/__init__.py
from flask import Flask
from .routes import bp as routes_bp

def create_app():
    app = Flask(__name__)
    app.register_blueprint(routes_bp)
    return app
EOF

          cat << 'EOF' > src/app/routes.py
from flask import Blueprint, render_template

bp = Blueprint("routes", __name__)

@bp.route("/")
def index():
    return render_template("index.html")

@bp.route("/offline")
def offline():
    return render_template("offline.html")
EOF

          cat << 'EOF' > src/app/security.py
"""
Security utilities for the High-Security Flask PWA Template.
This module is a placeholder for future security-related helpers.
"""
EOF

          cat << 'EOF' > src/app/pwa.py
"""
PWA helpers for the High-Security Flask PWA Template.
This module is a placeholder for PWA-related utilities.
"""
EOF

      - name: Create templates
        shell: bash
        run: |
          cat << 'EOF' > src/app/templates/base.html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flask PWA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
</head>
<body class="bg-gray-100 text-gray-900">
    {% block content %}{% endblock %}
</body>
</html>
EOF

          cat << 'EOF' > src/app/templates/index.html
{% extends "base.html" %}
{% block content %}
<h1 class="text-3xl font-bold">Flask PWA Template</h1>
<p class="mt-4">This is the canonical high-security Flask PWA template.</p>
{% endblock %}
EOF

          cat << 'EOF' > src/app/templates/offline.html
{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-semibold">You are offline.</h1>
<p class="mt-2">Some features may be unavailable until connection is restored.</p>
{% endblock %}
EOF

      - name: Create tests
        shell: bash
        run: |
          cat << 'EOF' > src/app/tests/test_routes.py
def test_index_route(client):
    response = client.get("/")
    assert response.status_code == 200
EOF

          cat << 'EOF' > src/app/tests/test_security.py
def test_security_module_imports():
    import app.security
EOF

      - name: Create PWA static files
        shell: bash
        run: |
          cat << 'EOF' > src/app/static/js/service-worker.js
// Basic offline-ready service worker for the canonical template.
self.addEventListener("install", (event) => {
  event.waitUntil(self.skipWaiting());
});

self.addEventListener("activate", (event) => {
  event.waitUntil(self.clients.claim());
});

self.addEventListener("fetch", (event) => {
  // Placeholder fetch handler for future caching strategies.
});
EOF

          cat << 'EOF' > src/app/static/js/pwa.js
// Register the service worker if available.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/static/js/service-worker.js");
  });
}
EOF

          cat << 'EOF' > src/app/static/manifest.json
{
  "name": "High Security Flask PWA",
  "short_name": "FlaskPWA",
  "start_url": "/",
  "display": "standalone",
  "background_color": "#ffffff",
  "theme_color": "#2563eb",
  "icons": [
    {
      "src": "/static/icons/icon-192.png",
      "sizes": "192x192",
      "type": "image/png"
    },
    {
      "src": "/static/icons/icon-512.png",
      "sizes": "512x512",
      "type": "image/png"
    }
  ]
}
EOF

      - name: Create Tailwind input and placeholder output
        shell: bash
        run: |
          cat << 'EOF' > src/app/static/src/input.css
@tailwind base;
@tailwind components;
@tailwind utilities;
EOF

          cat << 'EOF' > src/app/static/css/tailwind.css
/* Tailwind CSS is generated by the staff-only workflow 50 Build Tailwind CSS (Staff Only).
 * Students should not edit this file directly. */
EOF

      - name: Create project metadata files
        shell: bash
        run: |
          cat << 'EOF' > README.md
# High-Security Flask PWA Template

This repository contains the canonical high-security Flask PWA template.
It can be fully reconstructed by running the staff-only workflow:

- \`56 Recreate Canonical Template (Dangerous)\`

Students should never run this workflow. It is reserved for staff to reset
or recreate the institutional reference template.
EOF

          cat << 'EOF' > LICENSE
MIT License

Copyright (c) 

Permission is hereby granted, free of charge, to any person obtaining a copy
...
EOF

          cat << 'EOF' > .gitignore
__pycache__/
*.pyc
*.pyo
*.pyd
.env
.env.*
venv/
.build/
dist/
node_modules/
EOF

          cat << 'EOF' > pyproject.toml
[project]
name = "high-security-flask-pwa"
version = "0.1.0"
description = "Canonical high-security Flask PWA template."
requires-python = ">=3.11"
EOF

          cat << 'EOF' > package.json
{
  "name": "high-security-flask-pwa-frontend",
  "version": "0.1.0",
  "private": true,
  "scripts": {
    "dev": "tailwindcss -i ./src/app/static/src/input.css -o ./src/app/static/css/tailwind.css --watch",
    "build": "tailwindcss -i ./src/app/static/src/input.css -o ./src/app/static/css/tailwind.css --minify"
  }
}
EOF

          cat << 'EOF' > tailwind.config.js
module.exports = {
  content: ["./src/app/templates/**/*.html"],
  theme: {
    extend: {}
  },
  plugins: []
};
EOF

      - name: Final confirmation
        shell: bash
        run: echo "Canonical template successfully recreated."
