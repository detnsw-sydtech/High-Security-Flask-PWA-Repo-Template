name: 03 Manual DAST Scan (Wapiti3)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: .

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------
  # Manual DAST Scan (Wapiti3 Active Scanner)
  # ---------------------------------------------------------
  wapiti-manual:
    name: Manual DAST Active Scan (Wapiti3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.20"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Create virtual environment
        run: uv venv

      - name: Install Wapiti3
        run: |
          uv sync --frozen --directory .venv
          uv pip install wapiti3

      - name: Start Flask app
        run: |
          uv run flask run --host=0.0.0.0 --port=5000 &
          sleep 5

      - name: Run Wapiti3 Active Scan
        run: |
          uv run wapiti \
            -u http://localhost:5000 \
            -f json \
            -o wapiti-report.json

      - name: Upload Wapiti3 Report
        uses: actions/upload-artifact@v4
        with:
          name: wapiti3-report
          path: wapiti-report.json
          if-no-files-found: ignore
