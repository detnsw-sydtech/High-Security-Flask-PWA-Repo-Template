name: 03 CI (quality + security)

defaults:
  run:
    working-directory: .

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-tailwind-folders:
    name: Check Tailwind folder structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Tailwind folder exists
        run: |
          if [ ! -d "src/app/static/css" ]; then
            echo "ERROR: Tailwind css folder missing: src/app/static/css"
            exit 1
          fi

          if [ ! -f "src/app/static/css/input.css" ]; then
            echo "ERROR: Tailwind input.css missing"
            exit 1
          fi

          echo "Tailwind folder structure OK"

  quality:
    name: Quality (Ruff + pytest + mypy)
    runs-on: ubuntu-latest
    needs: check-tailwind-folders

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.20"

      - name: Cache uv package store
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies (app + dev)
        run: uv sync --frozen --directory .venv

      - name: Debug .venv/bin
        run: ls -al .venv/bin

      - name: Ruff (lint + style)
        run: .venv/bin/ruff check .

      - name: Mypy (static typing)
        run: .venv/bin/mypy src

      - name: Pytest (unit tests)
        run: .venv/bin/pytest -q

  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.20"

      - name: Cache uv package store
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Create virtual environment
        run: uv venv

      - name: Install dev dependencies
        run: uv sync --frozen --directory .venv

      - name: Bandit (Python SAST)
        run: venv/bin/bandit -r src -ll -c bandit.yaml

      - name: Semgrep (security rules)
        run: .venv/bin/semgrep --config p/ci --error --quiet

  dependencies:
    name: Dependency Vulnerabilities + SBOM (pip-audit)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.20"

      - name: Cache uv package store
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --frozen --directory .venv

      - name: pip-audit (Python dependency vulnerabilities)
        run: .venv/bin/pip-audit

      - name: Generate SBOM (CycloneDX JSON)
        run: .venv/bin/pip-audit --format cyclonedx-json --output sbom-python.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-python
          path: sbom-python.json

  secrets:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-banner --redact --config .gitleaks.toml

  osv:
    name: OSV Scanning (whole repo)
    runs-on: ubuntu-latest
    needs: [quality, dependencies]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: OSV Scan
        uses: ossf/osv-scanner-action@v1
        with:
          scan-args: |
            --recursive
            --skip-git
            .
