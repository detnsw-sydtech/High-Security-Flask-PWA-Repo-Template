name: 02 Canonical Structure Check

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  canonical-structure:
    name: Validate Canonical Project Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate directory structure
        run: |
          REQUIRED_DIRS=(
            "src/app"
            "src/app/templates"
            "src/app/static/css"
            "src/app/static/src"
            "src/app/static/js"
            "src/app/static/icons"
            "src/app/tests"
          )

          for d in "${REQUIRED_DIRS[@]}"; do
            if [ ! -d "$d" ]; then
              echo "❌ Missing directory: $d"
              exit 1
            fi
          done

      - name: Validate required files
        run: |
          REQUIRED_FILES=(
            "src/app/__init__.py"
            "src/app/routes.py"
            "src/app/security.py"
            "src/app/pwa.py"
            "src/app/templates/base.html"
            "src/app/templates/index.html"
            "src/app/templates/offline.html"
            "src/app/static/css/tailwind.css"
            "src/app/static/src/input.css"
            "src/app/static/js/service-worker.js"
            "src/app/static/js/pwa.js"
            "src/app/static/manifest.json"
            "src/app/tests/test_routes.py"
            "src/app/tests/test_security.py"
            "pyproject.toml"
            "package.json"
            "tailwind.config.js"
            "README.md"
            "LICENSE"
          )

          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing file: $f"
              exit 1
            fi
          done

      - name: Canonical structure check passed
        run: echo "✔ Canonical structure is valid."
