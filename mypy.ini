[mypy]
python_version = 3.13

# Flask, SQLAlchemy, and many extensions do not ship type stubs.
ignore_missing_imports = True

# Your routes intentionally omit type hints for readability.
disallow_untyped_defs = False

# Helpful warnings without overwhelming students.
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
