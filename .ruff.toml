# .ruff.toml
# Ruff configuration for the STHS Flask PWA template.

target-version = "py311"
line-length = 88
src = ["src"]

select = [
    "E",
    "F",
    "W",
    "I",
]

ignore = [
    "E203",
    "E266",
]

[per-file-ignores]
"src/app/db/models.py" = ["E501"]

[isort]
combine-as-imports = true
force-single-line = false
